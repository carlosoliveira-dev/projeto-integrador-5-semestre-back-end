openapi: 3.0.0
info:
  title: Projeto Integrador 5º Semestre API
  version: 1.0.0
  description: API para gerenciamento de usuários, perfis, produtos e fornecedores. A autenticação JWT é exigida nas rotas de produtos.
  contact:
    name: Carlos Oliveira
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
          description: Detalhes adicionais do erro, quando disponíveis.
    User:
      type: object
      description: Registro retornado pela listagem de usuários, incluindo o hash armazenado da senha.
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        password:
          type: string
          description: Hash bcrypt persistido para a senha.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SignupResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        user:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
              format: email
            created_at:
              type: string
              format: date-time
    LoginResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        user:
          type: object
          properties:
            user_id:
              type: integer
            name:
              type: string
            email:
              type: string
              format: email
    Product:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
        description:
          type: string
        barCode:
          type: string
        stockQuantity:
          type: string
        category:
          type: string
        expirationDate:
          type: string
          format: date
        image:
          type: string
        createdAt:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Supplier:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        companyName:
          type: string
        cnpj:
          type: string
        primaryContactName:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Profile:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        bio:
          type: string
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        phone:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        website:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProductSupplier:
      type: object
      properties:
        productId:
          type: integer
        supplierId:
          type: integer
    Message:
      type: object
      properties:
        message:
          type: string
tags:
  - name: Users
    description: Cadastro, login e consulta de usuários
  - name: Profiles
    description: Gerenciamento de perfis de usuários
  - name: Products
    description: Gerenciamento autenticado de produtos e associações
  - name: Suppliers
    description: Gerenciamento de fornecedores e associações
paths:
  /users/signup:
    post:
      summary: Cadastrar usuário
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '201':
          description: Usuário cadastrado e token JWT emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '400':
          description: Campos obrigatórios ausentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: E-mail já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/login:
    post:
      summary: Fazer login
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login realizado e token JWT emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: E-mail ou senha ausentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users:
    get:
      summary: Listar usuários
      tags:
        - Users
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /profile:
    get:
      summary: Listar perfis
      tags:
        - Profiles
      responses:
        '200':
          description: Lista de perfis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profile'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Criar perfil de usuário
      tags:
        - Profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: integer
                bio:
                  type: string
                avatarUrl:
                  type: string
                  format: uri
                birthDate:
                  type: string
                  format: date
                phone:
                  type: string
                location:
                  type: string
                website:
                  type: string
                  format: uri
      responses:
        '201':
          description: Perfil criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  profile:
                    $ref: '#/components/schemas/Profile'
        '409':
          description: Usuário não cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Atualizar perfil de usuário
      tags:
        - Profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: integer
                bio:
                  type: string
                avatarUrl:
                  type: string
                  format: uri
                birthDate:
                  type: string
                  format: date
                phone:
                  type: string
                location:
                  type: string
                website:
                  type: string
                  format: uri
      responses:
        '201':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  profile:
                    $ref: '#/components/schemas/Profile'
        '409':
          description: Usuário não cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /profile/{userId}:
    delete:
      summary: Excluir perfil de usuário
      tags:
        - Profiles
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
          description: ID do usuário proprietário do perfil
      responses:
        '200':
          description: Perfil excluído
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Perfil não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /products:
    get:
      summary: Listar produtos
      tags:
        - Products
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          description: Token não fornecido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /products/{id}:
    post:
      summary: Criar produto para usuário
      tags:
        - Products
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID do usuário proprietário do produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Dados inválidos ou usuário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token não fornecido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: ID do usuário no POST; ID do produto nos demais métodos
    get:
      summary: Obter produto por ID
      tags:
        - Products
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Produto encontrado ou null quando não existe
          content:
            application/json:
              schema:
                type: object
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/Product'
        '401':
          description: Token não fornecido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Atualizar produto por ID
      tags:
        - Products
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: integer
                name:
                  type: string
                description:
                  type: string
                barCode:
                  type: string
                stockQuantity:
                  type: string
                category:
                  type: string
                expirationDate:
                  type: string
                  format: date
                image:
                  type: string
      responses:
        '201':
          description: Produto atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  product:
                    $ref: '#/components/schemas/Product'
        '401':
          description: Token não fornecido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Usuário ou produto não cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Excluir produto por ID
      tags:
        - Products
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Produto excluído
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          description: Token não fornecido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Produto não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /products/{productId}/suppliers:
    get:
      summary: Listar associações de fornecedores do produto
      tags:
        - Products
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de associações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductSupplier'
        '401':
          description: Token não fornecido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Produto não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /products/{productId}/suppliers/{supplierId}:
    parameters:
      - in: path
        name: productId
        required: true
        schema:
          type: integer
      - in: path
        name: supplierId
        required: true
        schema:
          type: integer
    post:
      summary: Associar fornecedor ao produto
      tags:
        - Products
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Fornecedor associado ao produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          description: Token não fornecido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Produto ou fornecedor não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Desassociar fornecedor do produto
      tags:
        - Products
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Fornecedor desassociado do produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          description: Token não fornecido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Produto ou fornecedor não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /suppliers:
    get:
      summary: Listar fornecedores
      tags:
        - Suppliers
      responses:
        '200':
          description: Lista de fornecedores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Supplier'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /suppliers/{id}:
    post:
      summary: Criar fornecedor para usuário
      tags:
        - Suppliers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID do usuário proprietário do fornecedor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - companyName
                - cnpj
                - primaryContactName
              properties:
                companyName:
                  type: string
                cnpj:
                  type: string
                primaryContactName:
                  type: string
                address:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: Fornecedor criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '400':
          description: Dados inválidos ou usuário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: ID do usuário no POST; ID do fornecedor nos demais métodos
    get:
      summary: Obter fornecedor por ID
      tags:
        - Suppliers
      responses:
        '200':
          description: Fornecedor encontrado ou null quando não existe
          content:
            application/json:
              schema:
                type: object
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/Supplier'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Atualizar fornecedor por ID
      tags:
        - Suppliers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                companyName:
                  type: string
                cnpj:
                  type: string
                primaryContactName:
                  type: string
                address:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Fornecedor atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  supplier:
                    $ref: '#/components/schemas/Supplier'
        '409':
          description: Fornecedor não cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Excluir fornecedor por ID
      tags:
        - Suppliers
      responses:
        '200':
          description: Fornecedor excluído
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Fornecedor não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /suppliers/{supplierId}/products:
    get:
      summary: Listar associações de produtos do fornecedor
      tags:
        - Suppliers
      parameters:
        - in: path
          name: supplierId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de associações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductSupplier'
        '404':
          description: Fornecedor não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /suppliers/{supplierId}/products/{productId}:
    parameters:
      - in: path
        name: supplierId
        required: true
        schema:
          type: integer
      - in: path
        name: productId
        required: true
        schema:
          type: integer
    post:
      summary: Associar produto ao fornecedor
      tags:
        - Suppliers
      responses:
        '201':
          description: Produto associado ao fornecedor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Produto ou fornecedor não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Desassociar produto do fornecedor
      tags:
        - Suppliers
      responses:
        '200':
          description: Produto desassociado do fornecedor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Produto ou fornecedor não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
